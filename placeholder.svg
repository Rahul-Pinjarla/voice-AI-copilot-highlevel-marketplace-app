<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)" rx="16"/>
  <rect width="500" height="500" fill="url(#shine)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="420" cy="80" r="80" fill="white" opacity="0.05"/>
  <circle cx="80" cy="420" r="100" fill="white" opacity="0.05"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- Center icon -->
  <g transform="translate(190, 155)">
    <!-- Photo icon frame -->
    <rect x="0" y="0" width="120" height="90" rx="8" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
    <!-- Mountain shape -->
    <polygon points="10,80 45,35 70,60 85,45 110,80" fill="white" opacity="0.7"/>
    <!-- Sun circle -->
    <circle cx="90" cy="22" r="12" fill="white" opacity="0.85"/>
  </g>

  <!-- Text -->
  <text x="250" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle" opacity="0.95">Sample Image</text>
  <text x="250" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.7">500 × 500px · SVG · 1:1</text>

  <!-- Bottom label -->
  <rect x="150" y="365" width="200" height="36" rx="18" fill="white" opacity="0.15"/>
  <text x="250" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">highlevel placeholder</text>
</svg>
